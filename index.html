<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方方老師 AI 工具箱 </title>
    <meta name="description" content="探索方方老師精心設計的 AI 工具，具備淺色與深色雙主題模式，涵蓋課程設計、教材產出、教學評量與行政輔助，提升教育專業與效率。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@500&display=swap" rel="stylesheet">

    <style>
        @property --angle-1 { syntax: "<angle>"; inherits: false; initial-value: -75deg; }
        @property --angle-2 { syntax: "<angle>"; inherits: false; initial-value: -45deg; }

        :root {
            --color-background: #0F0F1B;
            --color-text-primary: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.85);
            --color-glass-bg: rgba(255, 255, 255, 0.05);
            --color-glass-highlight: rgba(255, 255, 255, 0.3);
            --color-input-bg: rgba(0, 0, 0, 0.3);
            --color-input-border: rgba(255, 255, 255, 0.2);
            --color-input-placeholder: rgba(255, 255, 255, 0.5);
            --color-accent: #a7a7d1;
            --color-button-shadow-1: rgba(0, 0, 0, 0.05);
            --color-button-shadow-2: rgba(255, 255, 255, 0.5);
            --color-button-shadow-3: rgba(0, 0, 0, 0.2);
            --color-button-shadow-4: rgba(255, 255, 255, 0.2);
            --anim--hover-time: 400ms;
            --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
            --spacing-large: 32px;
            --spacing-xlarge: 64px;
            --border-radius-medium: 20px;
            --header-height: 80px;
        }
        
        body.light-mode {
            --color-background: #F0F2F5;
            --color-text-primary: #0F0F1B;
            --color-text-secondary: rgba(15, 15, 27, 0.85);
            --color-glass-bg: rgba(255, 255, 255, 0.5);
            --color-input-bg: rgba(255, 255, 255, 0.6);
            --color-input-border: rgba(0, 0, 0, 0.1);
            --color-input-placeholder: rgba(15, 15, 27, 0.5);
            --color-accent: #4a4e91;
            --color-button-shadow-1: rgba(255, 255, 255, 0.1);
            --color-button-shadow-2: rgba(0, 0, 0, 0.2);
            --color-button-shadow-3: rgba(0, 0, 0, 0.1);
            --color-button-shadow-4: rgba(0, 0, 0, 0.05);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; scroll-behavior: smooth; }
        body {
            min-height: 100%; width: 100%; display: flex; flex-direction: column;
            font-family: "Inter", "Noto Sans TC", sans-serif;
            background-color: var(--color-background);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden; color: var(--color-text-secondary);
            transition: background 0.5s ease;
        }

        #tsparticles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        h1, h2, h3, h4 { color: var(--color-text-primary); font-weight: 700; }
        
        .container { width: 92%; max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
        main { flex-grow: 1; width: 100%; padding-bottom: var(--spacing-xlarge); }

        .glass-container {
            position: relative; border-radius: var(--border-radius-medium);
            isolation: isolate; background-color: var(--color-glass-bg);
            border: 1px solid var(--color-input-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        /* 頂部導航 */
        .site-header {
            width: 100%; padding: 12px 0; position: sticky; top: 0; z-index: 100;
            background: rgba(var(--color-background), 0.8);
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--color-input-border);
            height: var(--header-height); display: flex; align-items: center;
        }
        .site-header .container { display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-size: clamp(1.2rem, 3vw, 1.5rem); margin: 0; }
        .main-nav { display: flex; align-items: center; gap: 16px; }

        /* 復刻原版高級發光按鈕 (用於右上角) */
        .button-wrap { position: relative; z-index: 2; border-radius: 999vw; background: transparent; flex-shrink: 0; }
        .button-wrap button {
            --border-width: 2px; all: unset; cursor: pointer; position: relative;
            z-index: 3; background: linear-gradient(-75deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border-radius: 999vw;
            box-shadow: inset 0 0.125em 0.125em var(--color-button-shadow-1), inset 0 -0.125em 0.125em var(--color-button-shadow-2), 0 0.25em 0.125em -0.125em var(--color-button-shadow-3), 0 0 0.1em 0.25em inset var(--color-button-shadow-4);
            backdrop-filter: blur(4px); transition: all var(--anim--hover-time) var(--anim--hover-ease);
            display: flex; justify-content: center; align-items: center;
        }
        .button-wrap button:hover { transform: scale(0.975); }
        .button-wrap button:active { transform: scale(0.95); background: linear-gradient(-75deg, rgba(150, 120, 255, 0.1), rgba(180, 150, 255, 0.3), rgba(150, 120, 255, 0.1)); }
        
        .button-wrap button span, .button-wrap button .theme-icon {
            position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
            user-select: none; font-weight: 600; font-size: 0.9rem;
            color: var(--color-text-primary); text-shadow: 0em 0.1em 0.2em rgba(0, 0, 0, 0.25);
            padding: 0.8em 1.5em; white-space: nowrap; width: 100%;
        }
        
        .theme-icon { padding: 0.8em !important; line-height: 1; }
        .theme-icon svg { width: 1.2em; height: 1.2em; fill: var(--color-text-primary); }
        #user-avatar { width: 22px; height: 22px; border-radius: 50%; display: none; object-fit: cover; }

        .button-wrap button span::after {
            content: ""; display: block; position: absolute; z-index: 1;
            width: calc(100% - var(--border-width)); height: calc(100% - var(--border-width));
            top: calc(0% + var(--border-width) / 2); left: calc(0% + var(--border-width) / 2);
            box-sizing: border-box; border-radius: 999vw; overflow: clip;
            background: linear-gradient(var(--angle-2), rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.5) 40% 50%, rgba(255, 255, 255, 0) 55%);
            mix-blend-mode: screen; pointer-events: none; background-size: 200% 200%; background-position: 0% 50%; background-repeat: no-repeat;
            transition: background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease), --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
        }
        .button-wrap button:hover span::after { background-position: 25% 50%; }

        .button-wrap button::after {
            content: ""; position: absolute; z-index: 1; inset: 0; border-radius: 999vw;
            width: calc(100% + var(--border-width)); height: calc(100% + var(--border-width));
            top: calc(0% - var(--border-width) / 2); left: calc(0% - var(--border-width) / 2);
            padding: var(--border-width); box-sizing: border-box;
            background: conic-gradient(from var(--angle-1) at 50% 50%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 5% 40%, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0) 60% 95%, rgba(0, 0, 0, 0.5)), linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5));
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
            transition: all var(--anim--hover-time) var(--anim--hover-ease), --angle-1 500ms ease;
            box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255, 255, 255, 0.5);
        }
        .button-wrap button:hover::after { --angle-1: -125deg; }

        /* Hero Section */
        .hero { padding: var(--spacing-large) 0; text-align: center; }
        .hero-content { padding: var(--spacing-large); max-width: 800px; margin: 0 auto; }
        .hero-title { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 16px; }
        .hero-subtitle { font-size: clamp(0.95rem, 1.5vw, 1.1rem); margin-bottom: 24px; line-height: 1.6; }

        /* 搜尋列與橫向 Tab */
        .controls-wrapper {
            position: sticky; top: var(--header-height); z-index: 90; padding: 16px 0;
            background: linear-gradient(to bottom, var(--color-background) 80%, transparent);
        }
        .search-container { max-width: 600px; margin: 0 auto 16px auto; position: relative; }
        #search-input {
            width: 100%; padding: 12px 40px 12px 20px; border-radius: 99px;
            background: var(--color-input-bg); border: 1px solid var(--color-input-border);
            color: var(--color-text-primary); font-size: 1rem; transition: all 0.3s;
        }
        #search-input:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(167, 167, 209, 0.2); }
        .clear-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-text-secondary); cursor: pointer; display: none; font-size: 1.2rem; }

        .category-tabs { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 99px; flex-shrink: 0;
            background: var(--color-glass-bg); border: 1px solid var(--color-input-border);
            color: var(--color-text-primary); font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; scroll-snap-align: start;
        }
        .filter-tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .filter-tab:hover { background: var(--color-input-border); }
        .filter-tab.active { background: var(--color-text-primary); color: var(--color-background); border-color: var(--color-text-primary); }
        .filter-tab[data-cat="我的收藏"] svg { stroke: #ff4757; }
        .filter-tab[data-cat="我的收藏"].active svg { stroke: var(--color-background); }

        /* Netflix 風格卡片列 */
        #tools-container { display: flex; flex-direction: column; gap: var(--spacing-xlarge); margin-top: 24px; padding-bottom: 64px; }
        .category-row { display: flex; flex-direction: column; gap: 16px; }
        .category-row.hidden { display: none; }
        .row-header { display: flex; align-items: center; gap: 12px; }
        .row-icon { display: flex; align-items: center; }
        .row-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--color-text-primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .row-title { font-size: 1.4rem; letter-spacing: 0.5px; }

        .row-scroll {
            display: flex; overflow-x: auto; gap: 20px; padding: 10px 0 24px 0;
            scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--color-input-border) transparent;
        }
        .row-scroll::-webkit-scrollbar { height: 8px; }
        .row-scroll::-webkit-scrollbar-track { background: transparent; }
        .row-scroll::-webkit-scrollbar-thumb { background-color: var(--color-input-border); border-radius: 20px; }

        /* 工具卡片 */
        .tool-card {
            flex: 0 0 320px; display: flex; flex-direction: column; min-height: 260px;
            padding: 24px; scroll-snap-align: start; transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative;
        }
        .tool-card.hidden { display: none !important; }
        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        
        .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; padding-right: 30px; }
        .tool-name { font-size: 1.2rem; line-height: 1.3; }
        .tool-description { font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; opacity: 0.9; }

        /* 愛心收藏按鈕 */
        .favorite-btn {
            position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer;
            color: var(--color-input-placeholder); transition: transform 0.2s, color 0.3s; z-index: 10;
        }
        .favorite-btn:hover { transform: scale(1.1); }
        .favorite-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; transition: fill 0.3s; }
        .favorite-btn.active { color: #ff4757; }
        .favorite-btn.active svg { fill: #ff4757; stroke: #ff4757; }

        /* 新手推薦星星 SVG */
        .sparkle-icon { color: #FFD700; flex-shrink: 0; margin-top: 2px; }
        .sparkle-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* 卡片內的按鈕 */
        .card-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: auto; }
        .card-btn {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--color-input-border);
            background: var(--color-glass-bg); color: var(--color-text-primary); cursor: pointer;
            transition: all 0.3s; font-size: 0.85rem; font-weight: 500;
        }
        .card-btn:hover { background: var(--color-text-primary); color: var(--color-background); border-color: var(--color-text-primary); }
        
        .site-footer { padding: var(--spacing-large) 0; text-align: center; border-top: 1px solid var(--color-input-border); margin-top: 40px; }

        @media (max-width: 768px) {
            .site-title { font-size: 1.1rem; }
            .tool-card { flex: 0 0 85vw; }
            .card-buttons { grid-template-columns: 1fr; }
            .main-nav { gap: 8px; }
            .button-wrap button span { padding: 0.6em 1em; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">方方老師 | 教育AI平台</h1>
            <nav class="main-nav">
                <!-- 佈景切換按鈕 (復刻原版) -->
                <div class="button-wrap">
                    <button id="theme-switcher" aria-label="切換佈景主題"></button>
                </div>
                <!-- 登入收藏按鈕 (復刻原版外觀) -->
                <div class="button-wrap">
                    <button id="auth-btn">
                        <span>
                            <img id="user-avatar" src="" alt="Avatar">
                            <span id="auth-text">登入收藏</span>
                        </span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero-content glass-container">
                <h2 class="hero-title">賦能教師的 AI 智庫</h2>
                <p class="hero-subtitle">免登入即可自由探索！如果您喜歡某個工具，點擊右上角「登入」即可將它加入專屬的愛心收藏清單。<br>合作邀約：changsheng0612@gmail.com</p>
            </div>
        </section>

        <div class="container">
            <!-- 搜尋與導航 Tabs -->
            <div class="controls-wrapper">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="搜尋工具、關鍵字 (例如: 備課, 批改, 遊戲)...">
                    <button class="clear-btn" id="clear-btn">✖</button>
                </div>
                <div id="category-tabs-container" class="category-tabs"></div>
            </div>

            <!-- Netflix 風格卡片列 -->
            <div id="tools-container">
                <h3 id="loading-message" style="text-align: center; width: 100%; margin-top: 50px;">📡 正在連線至雲端資料庫...</h3>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 方方老師 教育AI工具箱 | All Rights Reserved.</p>
        </div>
    </footer>

    <!-- 套件載入 -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.4.0/tsparticles.bundle.min.js"></script>
    
    <!-- Firebase SDK (Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // ⚠️ 1. 請在這裡貼上您新建立的 Firebase 設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };

        // ==========================================
        // ⚠️ 2. 請貼上您 Google Sheet (V5 完美版) 的 TSV 網址
        // ==========================================
        const GOOGLE_SHEET_URL = 'YOUR_CSV_OR_TSV_URL';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 分類與圖標設定
        const categoryIcons = {
            "全部": `<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`,
            "我的收藏": `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
            "新手推薦": `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
            "精選必備": `<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>`,
            "課程與教案設計": `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
            "評量與作業批改": `<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            "班級經營與互動": `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            "親師溝通與行政": `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
            "學生自學與遊戲": `<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" ry="2"/><path d="M6 12h4"/><path d="M8 10v4"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>`,
            "專業進修與生活": `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`
        };
        const orderedCategories =["新手推薦", "精選必備", "課程與教案設計", "評量與作業批改", "班級經營與互動", "親師溝通與行政", "學生自學與遊戲", "專業進修與生活"];

        let currentUser = null;
        let userFavorites =[];
        let globalToolsData = {};

        // 頁面初始化
        document.addEventListener('DOMContentLoaded', async () => {
            initializeTheme();
            setupAuth();
            globalToolsData = await loadDataFromSheet(GOOGLE_SHEET_URL);
            if (globalToolsData) {
                renderTabs();
                renderRows();
                initializeSearch();
            }
        });

        // ==========================
        // 登入驗證與 Firebase 狀態同步
        // ==========================
        function setupAuth() {
            const authBtn = document.getElementById('auth-btn');
            const authText = document.getElementById('auth-text');
            const userAvatar = document.getElementById('user-avatar');

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    authText.textContent = "登出系統";
                    userAvatar.src = user.photoURL;
                    userAvatar.style.display = "block";
                    
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists()) {
                        userFavorites = docSnap.data().favorites ||[];
                    } else {
                        userFavorites =[];
                    }
                    updateAllHearts();
                } else {
                    currentUser = null;
                    userFavorites =[];
                    authText.textContent = "登入收藏";
                    userAvatar.style.display = "none";
                    updateAllHearts();
                }
            });

            authBtn.addEventListener('click', () => {
                if (currentUser) {
                    signOut(auth).then(() => alert("已成功登出！"));
                } else {
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).catch(error => console.error("登入失敗", error));
                }
            });
        }

        // ==========================
        // 愛心收藏邏輯 (綁定在 window 讓 HTML onclick 能呼叫)
        // ==========================
        window.toggleFavorite = async function(toolName, btnElement) {
            if (!currentUser) {
                alert("💡 請先點擊右上角「登入收藏」，才能將工具加入您的專屬清單喔！");
                return;
            }
            const isFav = userFavorites.includes(toolName);
            if (isFav) {
                userFavorites = userFavorites.filter(name => name !== toolName);
                btnElement.classList.remove('active');
            } else {
                userFavorites.push(toolName);
                btnElement.classList.add('active');
            }

            try {
                await setDoc(doc(db, "users", currentUser.uid), { favorites: userFavorites }, { merge: true });
            } catch (error) {
                alert("收藏同步失敗，請檢查網路連線。");
            }
            
            // 若在「我的收藏」分頁中取消愛心，自動刷新該分頁
            const activeTab = document.querySelector('.filter-tab.active');
            if(activeTab && activeTab.dataset.cat === '我的收藏') {
                filterByTab('我的收藏');
            }
        };

        function updateAllHearts() {
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                btn.classList.toggle('active', userFavorites.includes(btn.dataset.toolname));
            });
        }

        // ==========================
        // 資料讀取 (從 Google Sheet TSV)
        // ==========================
        async function loadDataFromSheet(url) {
            try {
                const res = await fetch(url);
                const text = await res.text();
                const rows = text.trim().split('\n').slice(1);
                
                const dataMap = {};
                orderedCategories.forEach(cat => dataMap[cat] =[]);

                rows.forEach(row => {
                    // 若您的 Sheet 是 CSV 格式發佈，請把 '\t' 換成 ','
                    const cols = row.split('\t').map(c => c.trim());
                    const[name, desc, tagsStr, u1, n1, u2, n2, u3, n3, u4, n4] = cols;
                    if (!name) return;

                    const toolObj = { name, desc, urls:[] };
                    if (u1 && u1.startsWith('http')) toolObj.urls.push({ link: u1, text: n1 || '前往' });
                    if (u2 && u2.startsWith('http')) toolObj.urls.push({ link: u2, text: n2 || '前往' });
                    if (u3 && u3.startsWith('http')) toolObj.urls.push({ link: u3, text: n3 || '前往' });
                    if (u4 && u4.startsWith('http')) toolObj.urls.push({ link: u4, text: n4 || '前往' });

                    const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) :[];
                    toolObj.isFeatured = tags.includes('新手推薦');

                    tags.forEach(tag => { 
                        if (dataMap[tag]) dataMap[tag].push(toolObj); 
                    });
                });
                
                document.getElementById('loading-message').remove();
                return dataMap;
            } catch (err) {
                document.getElementById('loading-message').textContent = '資料連線失敗，請確認 Google Sheet 網址是否正確。';
                return null;
            }
        }

        // ==========================
        // 渲染 UI (Tabs 與 Cards)
        // ==========================
        function renderTabs() {
            const container = document.getElementById('category-tabs-container');
            let html = `<button class="filter-tab active" data-cat="全部">${categoryIcons["全部"]} 全部工具</button>`;
            html += `<button class="filter-tab" data-cat="我的收藏">${categoryIcons["我的收藏"]} 我的收藏</button>`;
            
            orderedCategories.forEach(cat => {
                html += `<button class="filter-tab" data-cat="${cat}">${categoryIcons[cat]} ${cat}</button>`;
            });
            container.innerHTML = html;

            container.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    container.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    
                    const selectedCat = e.currentTarget.dataset.cat;
                    if (selectedCat === '我的收藏' && !currentUser) {
                        alert('💡 請先點擊右上角按鈕登入，才能查看您的專屬收藏清單喔！');
                        e.currentTarget.classList.remove('active');
                        container.querySelector('.filter-tab[data-cat="全部"]').classList.add('active');
                        filterByTab('全部');
                        return;
                    }
                    filterByTab(selectedCat);
                });
            });
        }

        function filterByTab(selectedCat) {
            const rows = document.querySelectorAll('.category-row');
            
            rows.forEach(row => {
                if (selectedCat === '全部') {
                    row.classList.remove('hidden');
                    row.querySelectorAll('.tool-card').forEach(c => c.classList.remove('hidden'));
                } else if (selectedCat === '我的收藏') {
                    row.classList.remove('hidden');
                    let hasVisible = false;
                    row.querySelectorAll('.tool-card').forEach(card => {
                        const isFav = userFavorites.includes(card.dataset.toolname);
                        card.classList.toggle('hidden', !isFav);
                        if(isFav) hasVisible = true;
                    });
                    row.classList.toggle('hidden', !hasVisible);
                } else {
                    row.classList.toggle('hidden', row.dataset.cat !== selectedCat);
                    row.querySelectorAll('.tool-card').forEach(c => c.classList.remove('hidden'));
                }
            });
            
            document.getElementById('search-input').value = '';
            document.getElementById('clear-btn').style.display = 'none';
        }

        function renderRows() {
            const mainContainer = document.getElementById('tools-container');
            let mainHtml = '';
            
            orderedCategories.forEach(cat => {
                const tools = globalToolsData[cat];
                if (!tools || tools.length === 0) return;

                let cardsHtml = '';
                tools.forEach(tool => {
                    const heartBtn = `<button class="favorite-btn" data-toolname="${tool.name}" onclick="toggleFavorite('${tool.name}', this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>`;
                    const sparkle = tool.isFeatured ? `<div class="sparkle-icon" title="新手推薦"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>` : '';
                    
                    let btnsHtml = '';
                    tool.urls.forEach(u => {
                        btnsHtml += `<button class="card-btn" onclick="window.open('${u.link}', '_blank')">${u.text}</button>`;
                    });

                    cardsHtml += `
                        <div class="tool-card glass-container" data-toolname="${tool.name}">
                            ${heartBtn}
                            <div class="card-header">
                                ${sparkle}
                                <h4 class="tool-name">${tool.name}</h4>
                            </div>
                            <p class="tool-description">${tool.desc}</p>
                            <div class="card-buttons">${btnsHtml}</div>
                        </div>
                    `;
                });

                mainHtml += `
                    <div class="category-row" data-cat="${cat}">
                        <div class="row-header">
                            <div class="row-icon">${categoryIcons[cat]}</div>
                            <h3 class="row-title">${cat}</h3>
                        </div>
                        <div class="row-scroll">${cardsHtml}</div>
                    </div>
                `;
            });

            mainContainer.innerHTML = mainHtml;
            updateAllHearts(); // 渲染完畢後，初始化愛心狀態
        }

        // ==========================
        // 搜尋功能
        // ==========================
        function initializeSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-btn');
            
            const performSearch = () => {
                const term = input.value.toLowerCase().trim();
                clearBtn.style.display = term ? 'block' : 'none';
                
                if (term) {
                    // 若有輸入文字，強制將上方 Tab 設為「全部」
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    document.querySelector('.filter-tab[data-cat="全部"]').classList.add('active');
                }

                document.querySelectorAll('.category-row').forEach(row => {
                    let hasVisible = false;
                    row.querySelectorAll('.tool-card').forEach(card => {
                        const match = card.textContent.toLowerCase().includes(term);
                        card.classList.toggle('hidden', !match);
                        if (match) hasVisible = true;
                    });
                    row.classList.toggle('hidden', !hasVisible);
                });
            };

            input.addEventListener('input', performSearch);
            clearBtn.addEventListener('click', () => { 
                input.value = ''; 
                performSearch(); 
            });
        }

        // ==========================
        // 主題切換 (背景與粒子特效)
        // ==========================
        function initializeTheme() {
            const btn = document.getElementById('theme-switcher');
            const body = document.body;
            const isLight = localStorage.getItem('theme') === 'light' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches);
            
            const sunIcon = `<span class="theme-icon"><svg viewBox="0 0 24 24"><path d="M12,18c-3.31,0-6-2.69-6-6s2.69-6,6-6s6,2.69,6,6S15.31,18,12,18zM12,8c-2.21,0-4,1.79-4,4c0,2.21,1.79,4,4,4s4-1.79,4-4C16,9.79,14.21,8,12,8zM11,1h2v3h-2V1zM11,20h2v3h-2V20zM3.55,4.95l1.41-1.41L7.05,5.64L5.64,7.05L3.55,4.95zM16.95,18.36l1.41-1.41l2.12,2.12l-1.41,1.41L16.95,18.36zM1,11h3v2H1V11zM20,11h3v2h-3V11zM5.64,16.95l1.41,1.41L4.95,20.45l-1.41-1.41L5.64,16.95zM18.36,5.64l1.41,1.41L20.45,4.95l-1.41-1.41L18.36,5.64z"/></svg></span>`;
            const moonIcon = `<span class="theme-icon"><svg viewBox="0 0 24 24"><path d="M12,22c-5.52,0-10-4.48-10-10S6.48,2,12,2c1.54,0,3,0.35,4.34,0.98C14.9,4.2,14,5.55,14,7c0,3.31,2.69,6,6,6c1.45,0,2.8-0.9,3.98-2.34C21.65,19,19.54,22,12,22z"/></svg></span>`;

            const applyTheme = (light) => {
                body.classList.toggle('light-mode', light);
                btn.innerHTML = light ? moonIcon : sunIcon;
                localStorage.setItem('theme', light ? 'light' : 'dark');
                initParticles(light);
            };

            applyTheme(isLight);
            btn.addEventListener('click', () => applyTheme(!body.classList.contains('light-mode')));
        }

        function initParticles(isLight) {
            if(window.tsParticles) {
                tsParticles.load("tsparticles", {
                    fpsLimit: 60, background: { color: "transparent" },
                    particles: {
                        number: { value: 30, density: { enable: true, area: 800 } },
                        color: { value: isLight ? "#4a4e91" : "#a7a7d1" },
                        links: { enable: true, color: isLight ? "#4a4e91" : "#a7a7d1", distance: 150, opacity: 0.2, width: 1 },
                        move: { enable: true, speed: 1 }, size: { value: 2 }, opacity: { value: 0.3 }
                    }
                });
            }
        }
    </script>
